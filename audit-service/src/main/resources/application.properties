spring.application.name=audit-service
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finassist_audit}
spring.datasource.username=postgres
spring.datasource.password=1q2w3e4r

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Configuration
spring.kafka.consumer.group-id=finassist-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Consumer Properties (JSON trusted packages and default type)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.finassist.audit_service.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.finassist.risk_service.kafka.event.TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false