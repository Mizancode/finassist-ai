services:

  # =========================================================
  # POSTGRESQL + PGVECTOR
  # =========================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: finassist-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1q2w3e4r

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - finassist-network


  # =========================================================
  # KAFKA
  # =========================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: finassist-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - finassist-network


  # =========================================================
  # OLLAMA
  # =========================================================

  ollama:
    image: ollama/ollama:latest
    container_name: finassist-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - finassist-network


  # =========================================================
  # AI ASSISTANT SERVICE
  # Database: finassist_ai
  # =========================================================

  ai-assistant-service:
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile

    container_name: finassist-ai-assistant
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finassist_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1q2w3e4r

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Ollama
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434

      # Other services
      FINASSIST_TRANSACTION_SERVICE_URL: http://transaction-service:8082
      FINASSIST_RISK_SERVICE_URL: http://risk-service:8084

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      ollama:
        condition: service_started

      transaction-service:
        condition: service_started

      risk-service:
        condition: service_started

    networks:
      - finassist-network


  # =========================================================
  # TRANSACTION SERVICE
  # Database: finassist_transaction
  # =========================================================

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile

    container_name: finassist-transaction
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finassist_transaction
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1q2w3e4r

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - finassist-network


  # =========================================================
  # DOCUMENT SERVICE
  # Database: CHANGE THIS TO YOUR ACTUAL DATABASE
  # =========================================================

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile

    container_name: finassist-document
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:

      # CHANGE finassist_document if your actual DB has another name
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finassist_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1q2w3e4r

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Ollama
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      ollama:
        condition: service_started

    networks:
      - finassist-network


  # =========================================================
  # RISK SERVICE
  # Database: finassist_risk
  # =========================================================

  risk-service:
    build:
      context: ./risk-service
      dockerfile: Dockerfile

    container_name: finassist-risk
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finassist_risk
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1q2w3e4r

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - finassist-network


  # =========================================================
  # AUDIT SERVICE
  # Database: finassist_audit
  # =========================================================

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile

    container_name: finassist-audit
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finassist_audit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1q2w3e4r

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - finassist-network


  # =========================================================
  # API GATEWAY
  # No database
  # =========================================================

  api-gateway:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile

    container_name: finassist-api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - ai-assistant-service
      - transaction-service
      - document-service
      - risk-service
      - audit-service

    networks:
      - finassist-network


# =========================================================
# VOLUMES
# =========================================================

volumes:

  postgres_data:

  kafka_data:

  ollama_data:


# =========================================================
# NETWORK
# =========================================================

networks:

  finassist-network:
    driver: bridge