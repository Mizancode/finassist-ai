spring.application.name=ai-assistant-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finassist_ai}
spring.datasource.username=postgres
spring.datasource.password=1q2w3e4r
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# ==========================================
# Spring AI - Ollama
# ==========================================

spring.ai.model.chat=ollama

spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.model.embedding=ollama

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.table-name=vector_store

spring.ai.ollama.chat.options.model=qwen3
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.think=false

# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# Logging
# ==========================================

logging.level.com.finassist.ai=INFO

spring.main.allow-bean-definition-overriding=true

finassist.services.transaction.base-url=${FINASSIST_TRANSACTION_SERVICE_URL:http://localhost:8082}
finassist.services.risk.base-url=${FINASSIST_RISK_SERVICE_URL:http://localhost:8084}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false